---
include:
  # --- Dongle ---
  - board: nice_nano_v2              # ensure this matches your USB receiver board, see note below
    shield: my_keyboard_dongle
  - board: nice_nano_v2
    shield: settings_reset

  # --- Halves as peripherals (examples; use your exact board names) ---
  - board: nice_view-eyelash_corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_view-eyelash_corne_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
 
