name: Draw Keymap
on:
  workflow_dispatch:
  push:
    paths:
      - "config/eyelash_corne.keymap"
      - "config/*.dtsi"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw.yml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      # Only draw this one keymap (prevents it from trying eyelash_common)
      keymap_patterns: |
        config/eyelash_corne.keymap
      # Optional: the drawer’s config file (ignored if it doesn’t exist)
      config_path: "keymap_drawer.config.yaml"
      # Where to write SVG/YAML; “commit” = commit them back
      destination: "commit"
      commit_message: "[Draw] ${{ github.event.head_commit.message }}"
